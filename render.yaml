# Deploy no Render (https://render.com) — sobe direto deste repositório.
#
# ATENÇÃO AO PLANO: o disco abaixo é o que segura usuários, pedidos e histórico.
# Disco persistente só existe em plano pago (starter, ~US$ 7/mês + ~US$ 0,25/GB).
#
# No plano free (sem disco) o Render apaga o sistema de arquivos a cada deploy
# E a cada vez que o serviço acorda depois de 15 min parado — ou seja, some todo
# mundo que se cadastrou e todos os pedidos da rodada. Para free, apague o bloco
# `disk:` e a variável DIR_DADOS, e troque `plan` para `free`, ciente disso.

services:
  - type: web
    name: espremedor-laranja
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: node servidor.js
    healthCheckPath: /api/sessao
    envVars:
      # Manda os JSON para o disco montado, fora da pasta do código.
      - key: DIR_DADOS
        value: /var/espremedor/dados
    disk:
      name: dados
      mountPath: /var/espremedor
      sizeGB: 1
